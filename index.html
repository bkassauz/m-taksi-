<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-taksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink: #23201B;
    --ink-soft: #5B564C;
    --plaster: #EFE7D8;
    --plaster-deep: #E4D9C4;
    --line: #D2C4A6;
    --card: #FBF8F1;

    --indigo: #1F4E79;
    --indigo-soft: #E4EDF3;
    --apricot: #E2854F;
    --apricot-soft: #FAEBE0;
    --clay: #8C6E4A;
    --clay-soft: #EFE8DC;
    --clay-deep: #6E5537;
    --error: #B3452E;
    --error-soft: #F6E4DE;
    --green: #4B7A4B;
    --green-soft: #E3EAE0;
    --green-deep: #3B613B;
    --gray-mid: #8A8478;
    --gray-soft: #EAE6DC;

    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--plaster);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body{
    background-image:
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 34px,
        rgba(35,32,27,0.035) 34px,
        rgba(35,32,27,0.035) 58px
      );
  }

  button{ font-family: var(--sans); }

  .screen{ display:none; min-height:100vh; }
  .screen.active{ display:flex; flex-direction:column; }

  /* ---------- shared road strip ---------- */
  .road-strip{
    width: 100%;
    height: 6px;
    background-color: var(--indigo);
    background-image: repeating-linear-gradient(
      90deg,
      var(--plaster) 0 18px,
      transparent 18px 34px
    );
    flex-shrink: 0;
  }

  /* ================= AUTH SCREEN ================= */
  .frame{
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 28px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .welcome{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    color: var(--ink-soft);
    margin: 0 0 6px;
    opacity: 0;
    animation: rise 0.6s ease-out 0.05s forwards;
  }

  .brand{
    font-family: var(--serif);
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0;
    opacity: 0;
    animation: rise 0.6s ease-out 0.16s forwards;
  }
  .brand span{ color: var(--apricot); }

  .mark{
    margin-top: 14px;
    width: 46px;
    height: 46px;
    opacity: 0;
    animation: rise 0.6s ease-out 0.26s forwards;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .section-label{
    margin: 44px 0 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    align-self: flex-start;
    opacity: 0;
    animation: rise 0.6s ease-out 0.34s forwards;
  }

  .route{
    width: 100%;
    display: flex;
    flex-direction: column;
    opacity: 0;
    animation: rise 0.6s ease-out 0.42s forwards;
  }

  .stop{ display: grid; grid-template-columns: 28px 1fr; column-gap: 16px; position: relative; }
  .stop:not(:last-child){ padding-bottom: 6px; }
  .stop-rail{ position: relative; display: flex; justify-content: center; }
  .stop-rail::before{
    content: ""; position: absolute; top: 0; bottom: -6px; width: 2px; background: var(--line);
  }
  .stop:last-child .stop-rail::before{ display: none; }
  .dot{
    position: relative; z-index: 1; margin-top: 26px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--line);
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  .option{
    width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 14px;
    cursor: pointer; text-align: left;
    transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  .option:hover{ border-color: var(--ink-soft); }
  .option:focus-visible{ outline: 2px solid var(--indigo); outline-offset: 2px; }

  .icon-wrap{
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-wrap svg{ width: 22px; height: 22px; }

  .option[data-role="haydovchi"] .icon-wrap{ background: var(--indigo-soft); color: var(--indigo); }
  .option[data-role="yolovchi"] .icon-wrap{ background: var(--apricot-soft); color: var(--apricot); }
  .option[data-role="admin"] .icon-wrap{ background: var(--clay-soft); color: var(--clay); }

  .option-text{ flex: 1; }
  .option-title{ font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .option-sub{ font-size: 13px; color: var(--ink-soft); }

  .chevron{ flex-shrink: 0; color: var(--line); transition: transform 0.18s ease, color 0.18s ease; }

  .option.active{ box-shadow: 0 0 0 1.5px currentColor; }
  .option[data-role="haydovchi"].active{ color: var(--indigo); border-color: var(--indigo); }
  .option[data-role="yolovchi"].active{ color: var(--apricot); border-color: var(--apricot); }
  .option[data-role="admin"].active{ color: var(--clay); border-color: var(--clay); }
  .option.active .chevron{ transform: translateX(3px); color: currentColor; }

  .stop.is-active .dot{ border-color: var(--ink); background: var(--ink); transform: scale(1.15); }

  .continue{
    width: 100%; margin-top: 0; padding: 0; border: none; border-radius: 10px;
    background: var(--ink); color: var(--plaster); font-size: 15px; font-weight: 600;
    cursor: pointer; max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height 0.28s ease, opacity 0.22s ease, padding 0.28s ease, margin 0.28s ease;
  }
  .continue.shown{ max-height: 60px; opacity: 1; padding: 15px; margin-top: 8px; }
  .continue:hover{ background: #000; }

  .hint{
    font-size: 13px; color: var(--ink-soft); margin: 10px 0 0; text-align: center;
    max-height: 0; opacity: 0; overflow: hidden; transition: all 0.2s ease;
  }
  .hint.shown{ max-height: 40px; opacity: 1; margin-top: 12px; }

  .spacer{ flex: 1; }

  footer{
    width: 100%; text-align: center; padding: 22px 16px 26px; font-size: 12.5px;
    color: var(--ink-soft); border-top: 1px solid var(--plaster-deep); background: var(--plaster-deep);
  }

  /* ================= ADMIN LOGIN SCREEN ================= */
  .login-frame{
    width: 100%; max-width: 400px; margin: 0 auto; padding: 40px 28px 32px;
    display: flex; flex-direction: column; flex: 1;
  }

  .back-btn{
    display: inline-flex; align-items: center; gap: 6px; background: none; border: none;
    color: var(--ink-soft); font-size: 14px; cursor: pointer; padding: 4px 0; margin-bottom: 28px;
    align-self: flex-start;
  }
  .back-btn:hover{ color: var(--ink); }

  .login-head{ display:flex; align-items:center; gap:14px; margin-bottom: 30px; }
  .login-icon{
    width: 46px; height: 46px; border-radius: 10px; background: var(--clay-soft); color: var(--clay);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .login-icon svg{ width: 24px; height: 24px; }
  .login-title{ font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0; }
  .login-sub{ font-size: 13.5px; color: var(--ink-soft); margin: 2px 0 0; }

  .field{ margin-bottom: 18px; }
  .field label{ display:block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
  .field input{
    width: 100%; padding: 13px 14px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); font-size: 15px; color: var(--ink); font-family: var(--sans);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus{ outline: none; border-color: var(--clay); box-shadow: 0 0 0 3px var(--clay-soft); }

  .login-error{
    display: none; align-items: center; gap: 8px; background: var(--error-soft); color: var(--error);
    font-size: 13.5px; padding: 11px 13px; border-radius: 8px; margin-bottom: 18px;
  }
  .login-error.shown{ display: flex; }

  .login-submit{
    width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--clay);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s ease;
  }
  .login-submit:hover{ background: var(--clay-deep); }

  .shake{ animation: shake 0.32s ease; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  /* ================= DASHBOARD SCREEN ================= */
  .dash-topbar{
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .topbar-left{ display: flex; align-items: center; gap: 16px; }

  .hamburger{
    width: 38px; height: 38px; border-radius: 8px; border: none; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    cursor: pointer;
  }
  .hamburger:hover{ background: var(--plaster-deep); }
  .hamburger span{
    width: 19px; height: 2px; background: var(--ink); border-radius: 2px;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }
  .drawer-open .hamburger span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .drawer-open .hamburger span:nth-child(2){ opacity: 0; }
  .drawer-open .hamburger span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

  .topbar-brand{ font-family: var(--serif); font-weight: 700; font-size: 19px; }
  .topbar-brand span{ color: var(--apricot); }

  .topbar-right{ display: flex; align-items: center; gap: 10px; }
  .avatar{
    width: 34px; height: 34px; border-radius: 50%; background: var(--clay); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
    font-family: var(--sans); flex-shrink: 0;
  }
  .admin-name{ font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .admin-role{ font-size: 11.5px; color: var(--ink-soft); }

  .dash-body{ flex: 1; display: flex; position: relative; overflow: hidden; }

  .backdrop{
    position: fixed; inset: 0; background: rgba(35,32,27,0.45); opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease; z-index: 20;
  }
  .drawer-open .backdrop{ opacity: 1; pointer-events: auto; }

  .drawer{
    position: fixed; top: 0; bottom: 0; left: 0; width: 270px; background: var(--ink);
    transform: translateX(-100%); transition: transform 0.24s ease; z-index: 30;
    display: flex; flex-direction: column; padding: 20px 14px;
  }
  .drawer-open .drawer{ transform: translateX(0); }

  .drawer-brand{
    font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--plaster);
    padding: 6px 10px 22px;
  }
  .drawer-brand span{ color: var(--apricot); }

  .nav-item{
    display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none;
    color: #C9C2B4; padding: 11px 12px; border-radius: 8px; font-size: 14.5px; font-weight: 500;
    cursor: pointer; text-align: left; margin-bottom: 2px; transition: background 0.15s ease, color 0.15s ease;
  }
  .nav-item svg{ width: 19px; height: 19px; flex-shrink: 0; }
  .nav-item:hover{ background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active{ background: var(--clay); color: #fff; }

  .drawer-spacer{ flex: 1; }
  .drawer-foot{ border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }

  .dash-main{ flex: 1; overflow-y: auto; padding: 30px 28px 40px; }
  .dash-main-inner{ max-width: 900px; }

  .dash-heading{ font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .dash-subheading{ font-size: 14px; color: var(--ink-soft); margin: 0 0 28px; }

  .stat-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px;
  }
  .stat-card{
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px;
  }
  .stat-label{ font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; }
  .stat-value{ font-family: var(--serif); font-size: 28px; font-weight: 600; color: var(--ink); }
  .stat-note{ font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .stat-note.pending{ color: var(--apricot); }

  .empty-panel{
    margin-top: 10px; border: 1px dashed var(--line); border-radius: 12px; padding: 44px 24px;
    text-align: center; color: var(--ink-soft); font-size: 14px;
  }
  .empty-panel strong{ display: block; color: var(--ink); font-family: var(--serif); font-size: 19px; font-weight: 600; margin-bottom: 6px; }

  /* ---------- drivers view ---------- */
  .widget-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 28px;
  }
  .widget-card{
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .widget-head{ display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .widget-ic{
    width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .widget-ic svg{ width: 17px; height: 17px; }
  .widget-title{ font-size: 13.5px; font-weight: 600; color: var(--ink); flex: 1; line-height: 1.25; }
  .widget-count{
    font-family: var(--serif); font-size: 17px; font-weight: 700; padding: 1px 9px; border-radius: 20px;
  }

  .widget-card.c-ichkarida .widget-ic{ background: var(--green-soft); color: var(--green); }
  .widget-card.c-ichkarida .widget-count{ background: var(--green-soft); color: var(--green-deep); }
  .widget-card.c-yolda .widget-ic{ background: var(--indigo-soft); color: var(--indigo); }
  .widget-card.c-yolda .widget-count{ background: var(--indigo-soft); color: var(--indigo); }
  .widget-card.c-bekatda .widget-ic{ background: var(--apricot-soft); color: var(--apricot); }
  .widget-card.c-bekatda .widget-count{ background: var(--apricot-soft); color: #A5602C; }
  .widget-card.c-offline .widget-ic{ background: var(--gray-soft); color: var(--gray-mid); }
  .widget-card.c-offline .widget-count{ background: var(--gray-soft); color: var(--gray-mid); }

  .widget-list{ max-height: 176px; overflow-y: auto; border-top: 1px solid var(--line); }
  .widget-row{ display: flex; align-items: center; gap: 10px; padding: 9px 16px; }
  .widget-row:not(:last-child){ border-bottom: 1px solid var(--plaster-deep); }
  .mini-avatar{
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700; color: #fff;
  }
  .widget-row-text{ min-width: 0; flex: 1; }
  .widget-row-name{ font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .widget-row-meta{ font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .widget-empty{ padding: 22px 16px; text-align: center; font-size: 12.5px; color: var(--ink-soft); }

  .list-toolbar{ display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .list-toolbar h2{ font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
  .list-toolbar span{ font-size: 12.5px; color: var(--ink-soft); }

  .driver-table{ border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .driver-table-head{
    display: grid; grid-template-columns: 2.1fr 1.3fr 1.6fr 1fr; gap: 10px; padding: 11px 16px;
    background: var(--plaster-deep); font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .driver-list-scroll{ max-height: 360px; overflow-y: auto; }
  .driver-row{
    display: grid; grid-template-columns: 2.1fr 1.3fr 1.6fr 1fr; gap: 10px; padding: 11px 16px; align-items: center;
  }
  .driver-row:not(:last-child){ border-bottom: 1px solid var(--plaster-deep); }
  .driver-who{ display: flex; align-items: center; gap: 10px; min-width: 0; }
  .driver-who .mini-avatar{ width: 32px; height: 32px; font-size: 12px; }
  .driver-name{ font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .driver-plate{ font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .driver-route{ font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status-pill{
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    padding: 4px 9px; border-radius: 20px; width: fit-content;
  }
  .status-pill::before{ content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-pill.s-ichkarida{ background: var(--green-soft); color: var(--green-deep); }
  .status-pill.s-yolda{ background: var(--indigo-soft); color: var(--indigo); }
  .status-pill.s-bekatda{ background: var(--apricot-soft); color: #A5602C; }
  .status-pill.s-offline{ background: var(--gray-soft); color: var(--gray-mid); }

  .add-driver-btn{
    width: 100%; margin-top: 16px; padding: 15px; border: none; border-radius: 10px;
    background: var(--green); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s ease;
  }
  .add-driver-btn:hover{ background: var(--green-deep); }
  .add-driver-note{
    text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 10px;
    max-height: 0; opacity: 0; overflow: hidden; transition: all 0.2s ease;
  }
  .add-driver-note.shown{ max-height: 30px; opacity: 1; }

  .driver-row{ cursor: pointer; transition: background 0.15s ease; }
  .driver-row:hover{ background: var(--plaster-deep); }
  .name-empty{ color: var(--ink-soft); font-style: italic; font-weight: 500; }

  /* ---------- driver detail modal ---------- */
  .modal-backdrop{
    position: fixed; inset: 0; background: rgba(35,32,27,0.5); display: flex; align-items: center;
    justify-content: center; padding: 20px; z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-backdrop.shown{ opacity: 1; pointer-events: auto; }

  .modal-panel{
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; background: var(--card);
    border-radius: 16px; padding: 24px 24px 26px; position: relative;
    transform: translateY(10px) scale(0.98); opacity: 0; transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .modal-backdrop.shown .modal-panel{ transform: translateY(0) scale(1); opacity: 1; }

  .modal-close{
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: var(--plaster-deep); color: var(--ink-soft); display: flex;
    align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease;
  }
  .modal-close:hover{ background: var(--line); color: var(--ink); }

  .modal-head{ display: flex; align-items: center; gap: 14px; margin-bottom: 22px; padding-right: 30px; }
  .modal-avatar{
    width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .modal-name{ font-family: var(--serif); font-size: 20px; font-weight: 600; margin: 0 0 3px; }
  .modal-plate{ font-size: 13px; color: var(--ink-soft); }

  .info-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-bottom: 22px; }
  .info-item{ background: var(--plaster); border-radius: 10px; padding: 11px 13px; }
  .info-label{ font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 5px; }
  .info-value{ font-size: 14px; font-weight: 600; color: var(--ink); }

  .cred-box{ border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .cred-box-head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cred-box-head h3{ font-size: 14px; font-weight: 700; margin: 0; }
  .cred-edit-btn{
    background: none; border: none; color: var(--indigo); font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 5px; padding: 3px 0;
  }
  .cred-edit-btn:hover{ text-decoration: underline; }

  .cred-field{ margin-bottom: 12px; }
  .cred-field:last-child{ margin-bottom: 0; }
  .cred-field label{ display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .cred-static{
    display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14.5px;
    font-weight: 600; color: var(--ink); background: var(--plaster); border-radius: 8px; padding: 10px 12px;
  }
  .eye-btn{ background: none; border: none; color: var(--ink-soft); cursor: pointer; display: flex; padding: 2px; flex-shrink: 0; }
  .eye-btn:hover{ color: var(--ink); }
  .cred-field input{
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); font-size: 14.5px; color: var(--ink); font-family: var(--sans);
  }
  .cred-field input:focus{ outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }
  .cred-field select{
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); font-size: 14.5px; color: var(--ink); font-family: var(--sans); cursor: pointer;
  }
  .cred-field select:focus{ outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }

  .cred-actions{ display: flex; gap: 10px; margin-top: 14px; }
  .cred-save, .cred-cancel{
    flex: 1; padding: 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: none;
  }
  .cred-save{ background: var(--indigo); color: #fff; }
  .cred-save:hover{ background: #163b5c; }
  .cred-cancel{ background: var(--plaster-deep); color: var(--ink); }
  .cred-cancel:hover{ background: var(--line); }

  .cred-saved-note{
    font-size: 12.5px; color: var(--green-deep); margin-top: 10px; text-align: center;
    max-height: 0; opacity: 0; overflow: hidden; transition: all 0.2s ease;
  }
  .cred-saved-note.shown{ max-height: 24px; opacity: 1; }

  .s-connected{ background: var(--green-soft); color: var(--green-deep); }
  .s-disconnected{ background: var(--gray-soft); color: var(--gray-mid); }
  .s-paid{ background: var(--green-soft); color: var(--green-deep); }
  .s-debt{ background: var(--error-soft); color: var(--error); }

  @media (max-width: 640px){
    .driver-table-head{ display: none; }
    .driver-row{ grid-template-columns: 1fr; gap: 6px; padding: 12px 16px; }
    .driver-route, .driver-plate{ padding-left: 42px; }
  }

  @media (max-width: 380px){
    .brand{ font-size: 36px; }
    .frame{ padding: 44px 20px 24px; }
  }
</style>
</head>
<body>

  <!-- ================= SCREEN 1: AUTH / PROFILE ================= -->
  <div class="screen active" id="screen-auth">
    <div class="road-strip" aria-hidden="true"></div>
    <div class="frame">
      <p class="welcome">Xush kelibsiz</p>
      <h1 class="brand">M-<span>taksi</span></h1>
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M8 30 L12 18 Q13 15 17 15 H31 Q35 15 36 18 L40 30" stroke="#23201B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="6" y="30" width="36" height="8" rx="3" stroke="#23201B" stroke-width="2.4"/>
        <circle cx="14" cy="40" r="3" fill="#E2854F"/>
        <circle cx="34" cy="40" r="3" fill="#E2854F"/>
        <path d="M17 15 L19 22 M29 22 L31 15" stroke="#23201B" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <p class="section-label">Profil tanlang</p>

      <div class="route" role="radiogroup" aria-label="Profil turi">
        <div class="stop" data-stop>
          <div class="stop-rail"><div class="dot"></div></div>
          <button class="option" type="button" data-role="haydovchi" role="radio" aria-checked="false">
            <span class="icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/>
                <path d="M12 3v6.4M12 14.6V21M4.2 7.8l5.4 3.2M14.4 13l5.4 3.2M19.8 7.8l-5.4 3.2M9.6 13l-5.4 3.2"/>
              </svg>
            </span>
            <span class="option-text">
              <span class="option-title">Haydovchi</span>
              <span class="option-sub">Yoʻnalish tanlang, yo'lovchi oling</span>
            </span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>

        <div class="stop" data-stop>
          <div class="stop-rail"><div class="dot"></div></div>
          <button class="option" type="button" data-role="yolovchi" role="radio" aria-checked="false">
            <span class="icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="6.5" r="2.8"/>
                <path d="M6 21l1.6-7.2a3 3 0 0 1 2.9-2.3h3a3 3 0 0 1 2.9 2.3L18 21"/>
              </svg>
            </span>
            <span class="option-text">
              <span class="option-title">Yoʻlovchi</span>
              <span class="option-sub">Taksi chaqiring, bekatni belgilang</span>
            </span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>

        <div class="stop" data-stop>
          <div class="stop-rail"><div class="dot"></div></div>
          <button class="option" type="button" data-role="admin" role="radio" aria-checked="false">
            <span class="icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6l7-3z"/>
                <path d="M9.5 12l1.8 1.8 3.2-3.6"/>
              </svg>
            </span>
            <span class="option-text">
              <span class="option-title">Admin</span>
              <span class="option-sub">Tizimni boshqaring</span>
            </span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

      <button class="continue" id="continueBtn" type="button">Davom etish</button>
      <p class="hint" id="hint">Bu profil hozircha tayyor emas — tez orada ishga tushadi.</p>

      <div class="spacer"></div>
    </div>
    <footer>created by imradjabov</footer>
  </div>

  <!-- ================= SCREEN 2: ADMIN LOGIN ================= -->
  <div class="screen" id="screen-admin-login">
    <div class="road-strip" aria-hidden="true"></div>
    <div class="login-frame">
      <button class="back-btn" type="button" id="backFromLogin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Profil tanlashga qaytish
      </button>

      <div class="login-head">
        <span class="login-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6l7-3z"/><path d="M9.5 12l1.8 1.8 3.2-3.6"/>
          </svg>
        </span>
        <div>
          <p class="login-title">Admin</p>
          <p class="login-sub">Tizimga kirish uchun maʼlumotlaringizni kiriting</p>
        </div>
      </div>

      <div id="loginForm">
        <div class="login-error" id="loginError">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <span>Login yoki parol notoʻgʻri</span>
        </div>

        <div class="field">
          <label for="loginInput">Login</label>
          <input type="text" id="loginInput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Loginni kiriting">
        </div>
        <div class="field">
          <label for="passInput">Parol</label>
          <input type="password" id="passInput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Parolni kiriting">
        </div>

        <button class="login-submit" id="loginSubmitBtn" type="button">Kirish</button>
      </div>
    </div>
    <footer>created by imradjabov</footer>
  </div>

  <!-- ================= SCREEN 3: ADMIN DASHBOARD ================= -->
  <div class="screen" id="screen-dashboard">
    <div id="drawerRoot">
      <div class="backdrop" id="backdrop"></div>
      <nav class="drawer" id="drawer">
        <div class="drawer-brand">M-<span>taksi</span></div>

        <button class="nav-item active" data-view="dashboard" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-view="haydovchilar" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.8 14.3c2.3.4 3.7 2.1 3.7 4.7"/></svg>
          Haydovchilar
        </button>
        <button class="nav-item" data-view="xarita" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3L3 5.4v15.2L9 18l6 2.6 6-2.4V3L15 5.6 9 3z"/><path d="M9 3v15M15 5.6v15"/></svg>
          Xarita sozlamalari
        </button>
        <button class="nav-item" data-view="tolov" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
          Toʻlov tizimi
        </button>
        <button class="nav-item" data-view="analitika" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2.5 20h19"/></svg>
          Analitika
        </button>
        <button class="nav-item" data-view="qollab" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M5.3 5.3l3.2 3.2M18.7 5.3l-3.2 3.2M5.3 18.7l3.2-3.2M18.7 18.7l-3.2-3.2"/></svg>
          Qoʻllab-quvvatlash markazi
        </button>
        <button class="nav-item" data-view="sozlamalar" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9c.8.7 1.6 1.2 2.6 1.5l.5 2.5h4l.5-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4-2-1.5z"/></svg>
          Sozlamalar
        </button>

        <div class="drawer-spacer"></div>
        <div class="drawer-foot">
          <button class="nav-item" id="logoutBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Chiqish
          </button>
        </div>
      </nav>
    </div>

    <div class="dash-topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" aria-label="Menyu">
          <span></span><span></span><span></span>
        </button>
        <span class="topbar-brand">M-<span>taksi</span></span>
      </div>
      <div class="topbar-right">
        <div style="text-align:right">
          <div class="admin-name">imradjabov</div>
          <div class="admin-role">Admin</div>
        </div>
        <span class="avatar">I</span>
      </div>
    </div>

    <div class="dash-body">
      <main class="dash-main">
        <div class="dash-main-inner" id="dashContent">
          <!-- filled by JS -->
        </div>
      </main>
    </div>

    <div class="modal-backdrop" id="driverModalBackdrop">
      <div class="modal-panel" id="driverModalPanel">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

<script>
  /* =========================================================
     SUPABASE SOZLAMALARI — bu yerga o'z maʼlumotlaringizni qo'ying
     Supabase loyihangiz: Project Settings > API sahifasidan oling
     ========================================================= */
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';        // masalan: https://abcxyz.supabase.co
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ---- Screen 1: profile selection ---- */
  const options = document.querySelectorAll('.option');
  const continueBtn = document.getElementById('continueBtn');
  const hint = document.getElementById('hint');
  let selectedRole = null;

  options.forEach(opt => {
    opt.addEventListener('click', () => {
      options.forEach(o => {
        o.classList.remove('active');
        o.setAttribute('aria-checked', 'false');
        o.closest('.stop').classList.remove('is-active');
      });
      opt.classList.add('active');
      opt.setAttribute('aria-checked', 'true');
      opt.closest('.stop').classList.add('is-active');
      selectedRole = opt.dataset.role;
      hint.classList.remove('shown');
      continueBtn.classList.add('shown');
      continueBtn.textContent = 'Davom etish — ' +
        (selectedRole === 'haydovchi' ? 'Haydovchi' : selectedRole === 'yolovchi' ? 'Yoʻlovchi' : 'Admin');
    });
  });

  continueBtn.addEventListener('click', () => {
    if (selectedRole === 'admin'){
      showScreen('screen-admin-login');
    } else {
      hint.classList.add('shown');
    }
  });

  /* ---- Screen 2: admin login ---- */
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginInput = document.getElementById('loginInput');
  const passInput = document.getElementById('passInput');

  document.getElementById('backFromLogin').addEventListener('click', () => {
    loginError.classList.remove('shown');
    loginInput.value = '';
    passInput.value = '';
    showScreen('screen-auth');
  });

  const loginSubmitBtn = document.getElementById('loginSubmitBtn');

  async function attemptLogin(){
    const loginVal = loginInput.value.trim();
    const passVal = passInput.value;
    if (!loginVal || !passVal) return;

    loginSubmitBtn.disabled = true;
    loginSubmitBtn.textContent = 'Tekshirilmoqda...';

    const email = loginVal.includes('@') ? loginVal : `${loginVal}@mtaksi.local`;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: passVal });

    loginSubmitBtn.disabled = false;
    loginSubmitBtn.textContent = 'Kirish';

    if (error){
      loginError.classList.add('shown');
      const frame = document.querySelector('.login-frame');
      frame.classList.remove('shake');
      void frame.offsetWidth;
      frame.classList.add('shake');
      return;
    }

    loginError.classList.remove('shown');
    showScreen('screen-dashboard');
    await loadDriversFromServer();
    setDashView('dashboard');
  }

  document.getElementById('loginSubmitBtn').addEventListener('click', attemptLogin);
  [loginInput, passInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') attemptLogin();
    });
  });

  /* ---- Screen 3: dashboard ---- */
  const drawerRoot = document.getElementById('screen-dashboard');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const backdrop = document.getElementById('backdrop');

  hamburgerBtn.addEventListener('click', () => drawerRoot.classList.toggle('drawer-open'));
  backdrop.addEventListener('click', () => drawerRoot.classList.remove('drawer-open'));

  const navItems = document.querySelectorAll('.nav-item[data-view]');
  const dashContent = document.getElementById('dashContent');

  const views = {
    dashboard: {
      heading: 'Dashboard',
      sub: 'Xush kelibsiz, imradjabov',
      stats: true
    },
    haydovchilar: { heading: 'Haydovchilar', sub: 'Barcha haydovchilar va ularning joriy holati', drivers: true },
    xarita: { heading: 'Xarita sozlamalari', sub: 'Yoʻnalish va bekatlarni xaritada sozlang', empty: true },
    tolov: { heading: 'Toʻlov tizimi', sub: 'Qatnovlar boʻyicha toʻlovlarni boshqaring', empty: true },
    analitika: { heading: 'Analitika', sub: 'Qatnovlar va yoʻnalishlar statistikasi', empty: true },
    qollab: { heading: 'Qoʻllab-quvvatlash markazi', sub: 'Murojaatlar va yordam soʻrovlari', empty: true },
    sozlamalar: { heading: 'Sozlamalar', sub: 'Tizim sozlamalarini boshqaring', empty: true }
  };

  let driversData = [];

  async function loadDriversFromServer(){
    const { data, error } = await supabaseClient
      .from('drivers')
      .select('*')
      .order('created_at', { ascending: true });

    if (error){
      console.error('Haydovchilarni yuklashda xatolik:', error.message);
      return;
    }
    driversData = data || [];
  }

  const statusMeta = {
    ichkarida: {
      label: 'Ishlamoqda',
      widgetTitle: 'Qishloq ichida yurganlar',
      avatarBg: '#4B7A4B',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>'
    },
    yolda: {
      label: 'Yoʻlda',
      widgetTitle: 'Yoʻlda boʻlganlar',
      avatarBg: '#1F4E79',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3"/></svg>'
    },
    bekatda: {
      label: 'Bekatda',
      widgetTitle: 'Bekatda turganlar',
      avatarBg: '#E2854F',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4a1 1 0 0 1 1-1h9l-2.5 4L16 11H7"/></svg>'
    },
    offline: {
      label: 'Offline',
      widgetTitle: 'Offline haydovchilar',
      avatarBg: '#8A8478',
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/><path d="M12 3v8"/></svg>'
    }
  };

  function initials(name){
    const n = (name || '').trim();
    if (!n) return '—';
    return n.split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
  }
  function displayName(name){
    const n = (name || '').trim();
    return n ? n : '<span class="name-empty">Ism kiritilmagan</span>';
  }

  function renderWidget(statusKey){
    const meta = statusMeta[statusKey];
    const rows = driversData.filter(d => d.status === statusKey);
    const rowsHtml = rows.length ? rows.map(d => `
        <div class="widget-row">
          <span class="mini-avatar" style="background:${meta.avatarBg}">${initials(d.name)}</span>
          <span class="widget-row-text">
            <span class="widget-row-name">${displayName(d.name)}</span>
            <span class="widget-row-meta">${d.plate} · ${d.route}</span>
          </span>
        </div>`).join('') : `<div class="widget-empty">Hozircha boʻsh</div>`;

    return `
      <div class="widget-card c-${statusKey}">
        <div class="widget-head">
          <span class="widget-ic">${meta.icon}</span>
          <span class="widget-title">${meta.widgetTitle}</span>
          <span class="widget-count">${rows.length}</span>
        </div>
        <div class="widget-list">${rowsHtml}</div>
      </div>`;
  }

  function renderDriversView(){
    const widgets = ['ichkarida','yolda','bekatda','offline'].map(renderWidget).join('');

    const rows = driversData.map((d, i) => {
      const meta = statusMeta[d.status];
      return `
        <div class="driver-row" data-idx="${i}">
          <div class="driver-who">
            <span class="mini-avatar" style="background:${meta.avatarBg}">${initials(d.name)}</span>
            <span class="driver-name">${displayName(d.name)}</span>
          </div>
          <span class="driver-plate">${d.plate}</span>
          <span class="driver-route">${d.route}</span>
          <span class="status-pill s-${d.status}">${meta.label}</span>
        </div>`;
    }).join('');

    return `
      <div class="widget-grid">${widgets}</div>

      <div class="list-toolbar">
        <h2>Barcha haydovchilar</h2>
        <span>${driversData.length} ta koʻrsatilmoqda</span>
      </div>

      ${driversData.length ? `
      <div class="driver-table">
        <div class="driver-table-head">
          <span>Ism</span><span>Raqami</span><span>Yoʻnalish</span><span>Holati</span>
        </div>
        <div class="driver-list-scroll">${rows}</div>
      </div>` : `
      <div class="empty-panel">
        <strong>Haydovchilar roʻyxati boʻsh</strong>
        Pastdagi tugma orqali birinchi haydovchini qoʻshing.
      </div>`}

      <button class="add-driver-btn" id="addDriverBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Haydovchi qoʻshish
      </button>`;
  }

  /* ---- generic modal helpers ---- */
  const modalBackdrop = document.getElementById('driverModalBackdrop');
  const modalPanel = document.getElementById('driverModalPanel');

  function openModal(){ modalBackdrop.classList.add('shown'); }
  function closeModal(){ modalBackdrop.classList.remove('shown'); }
  modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

  async function refreshDriversViewInPlace(){
    await loadDriversFromServer();
    const activeKey = document.querySelector('.nav-item.active')?.dataset.view;
    if (activeKey === 'haydovchilar') setDashView('haydovchilar');
  }

  /* ---- driver view / edit modal ---- */
  function renderDriverView(i){
    const d = driversData[i];
    const meta = statusMeta[d.status];

    modalPanel.innerHTML = `
      <button class="modal-close" id="modalCloseBtn" aria-label="Yopish">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>

      <div class="modal-head">
        <span class="modal-avatar" style="background:${meta.avatarBg}">${initials(d.name)}</span>
        <div>
          <p class="modal-name">${displayName(d.name)}</p>
          <p class="modal-plate">${d.plate}</p>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Login</div>
          <div class="info-value">${d.login}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Parol</div>
          <div class="info-value">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
              <span id="passDisplay">••••••••</span>
              <button class="eye-btn" id="passToggle" type="button" aria-label="Parolni koʻrsatish">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="info-item">
          <div class="info-label">Telefon raqami</div>
          <div class="info-value">${d.phone}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Qatnov yoʻnalishi</div>
          <div class="info-value">${d.route}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Asosiy ish vaqti</div>
          <div class="info-value">${d.hours}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Telegram holati</div>
          <div class="info-value"><span class="status-pill ${d.telegram ? 's-connected' : 's-disconnected'}">${d.telegram ? 'Ulangan' : 'Ulanmagan'}</span></div>
        </div>
        <div class="info-item" style="grid-column: span 2">
          <div class="info-label">Toʻlov holati</div>
          <div class="info-value"><span class="status-pill ${d.payment === 'toʻlangan' ? 's-paid' : 's-debt'}">${d.payment === 'toʻlangan' ? 'Toʻlangan' : 'Qarzdorlik bor'}</span></div>
        </div>
      </div>

      <button class="cred-edit-btn" id="editAllBtn" type="button" style="margin-bottom:2px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Maʼlumotlarni tahrirlash
      </button>`;

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('editAllBtn').addEventListener('click', () => renderDriverEdit(i));

    const passToggle = document.getElementById('passToggle');
    const passDisplay = document.getElementById('passDisplay');
    let revealed = false;
    passToggle.addEventListener('click', () => {
      revealed = !revealed;
      passDisplay.textContent = revealed ? d.pass : '••••••••';
    });
  }

  function renderDriverEdit(i){
    const d = driversData[i];

    modalPanel.innerHTML = `
      <button class="modal-close" id="modalCloseBtn" aria-label="Yopish">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="cred-box-head" style="margin-bottom:18px"><h3>Maʼlumotlarni tahrirlash</h3></div>

      <div class="cred-field"><label>Ism familiya</label>
        <input type="text" id="f_name" value="${d.name}" placeholder="Ism familiyani kiriting"></div>
      <div class="cred-field"><label>Login</label>
        <input type="text" id="f_login" value="${d.login}" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
      <div class="cred-field"><label>Parol</label>
        <input type="text" id="f_pass" value="${d.pass}" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
      <div class="cred-field"><label>Mashina raqami</label>
        <input type="text" id="f_plate" value="${d.plate}"></div>
      <div class="cred-field"><label>Qatnov yoʻnalishi</label>
        <input type="text" id="f_route" value="${d.route}"></div>
      <div class="cred-field"><label>Telefon raqami</label>
        <input type="text" id="f_phone" value="${d.phone}"></div>
      <div class="cred-field"><label>Asosiy ish vaqti</label>
        <input type="text" id="f_hours" value="${d.hours}"></div>
      <div class="cred-field"><label>Telegram holati</label>
        <select id="f_telegram">
          <option value="1" ${d.telegram ? 'selected' : ''}>Ulangan</option>
          <option value="0" ${!d.telegram ? 'selected' : ''}>Ulanmagan</option>
        </select></div>
      <div class="cred-field"><label>Toʻlov holati</label>
        <select id="f_payment">
          <option value="toʻlangan" ${d.payment === 'toʻlangan' ? 'selected' : ''}>Toʻlangan</option>
          <option value="qarzdor" ${d.payment === 'qarzdor' ? 'selected' : ''}>Qarzdorlik bor</option>
        </select></div>

      <div class="cred-actions">
        <button class="cred-cancel" id="editCancelBtn" type="button">Bekor qilish</button>
        <button class="cred-save" id="editSaveBtn" type="button">Saqlash</button>
      </div>`;

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('editCancelBtn').addEventListener('click', () => renderDriverView(i));
    document.getElementById('editSaveBtn').addEventListener('click', async () => {
      const saveBtn = document.getElementById('editSaveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saqlanmoqda...';

      const updated = {
        name: document.getElementById('f_name').value.trim(),
        login: document.getElementById('f_login').value.trim() || d.login,
        pass: document.getElementById('f_pass').value.trim() || d.pass,
        plate: document.getElementById('f_plate').value.trim() || d.plate,
        route: document.getElementById('f_route').value.trim() || d.route,
        phone: document.getElementById('f_phone').value.trim() || d.phone,
        hours: document.getElementById('f_hours').value.trim() || d.hours,
        telegram: document.getElementById('f_telegram').value === '1',
        payment: document.getElementById('f_payment').value
      };

      const { error } = await supabaseClient.from('drivers').update(updated).eq('id', d.id);

      if (error){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Saqlash';
        alert('Saqlashda xatolik: ' + error.message);
        return;
      }

      Object.assign(d, updated);
      await refreshDriversViewInPlace();
      closeModal();
    });
  }

  function openDriverModal(i){
    renderDriverView(i);
    openModal();
  }

  /* ---- add driver modal ---- */
  function slugifyLogin(name){
    const base = (name || 'haydovchi')
      .toLowerCase()
      .replace(/ʻ|'/g, '')
      .trim()
      .split(/\s+/)
      .join('.')
      .replace(/[^a-z.]/g, '');
    return base || 'haydovchi';
  }

  function renderAddDriverForm(){
    modalPanel.innerHTML = `
      <button class="modal-close" id="modalCloseBtn" aria-label="Yopish">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="cred-box-head" style="margin-bottom:18px"><h3>Yangi haydovchi qoʻshish</h3></div>

      <div class="cred-field"><label>Ism familiya</label>
        <input type="text" id="nf_name" placeholder="Masalan: Aziz Karimov"></div>
      <div class="cred-field"><label>Mashina raqami</label>
        <input type="text" id="nf_plate" placeholder="Masalan: 30 A 123 BC"></div>
      <div class="cred-field"><label>Qatnov yoʻnalishi</label>
        <input type="text" id="nf_route" placeholder="Masalan: Mudin → Qarshi"></div>
      <div class="cred-field"><label>Telegram aloqa</label>
        <select id="nf_telegram">
          <option value="1">Ulangan</option>
          <option value="0" selected>Ulanmagan</option>
        </select></div>
      <div class="cred-field"><label>Telefon raqami</label>
        <input type="text" id="nf_phone" placeholder="+998 90 123 45 67"></div>

      <p class="cred-saved-note" id="addErrNote" style="color:var(--error)">Ism, mashina raqami va telefon raqamini kiriting.</p>

      <div class="cred-actions">
        <button class="cred-cancel" id="addCancelBtn" type="button">Bekor qilish</button>
        <button class="cred-save" id="addSaveBtn" type="button">Saqlash</button>
      </div>`;

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('addCancelBtn').addEventListener('click', closeModal);
    document.getElementById('addSaveBtn').addEventListener('click', async () => {
      const name = document.getElementById('nf_name').value.trim();
      const plate = document.getElementById('nf_plate').value.trim();
      const route = document.getElementById('nf_route').value.trim() || 'Belgilanmagan';
      const telegram = document.getElementById('nf_telegram').value === '1';
      const phone = document.getElementById('nf_phone').value.trim();

      if (!name || !plate || !phone){
        document.getElementById('addErrNote').classList.add('shown');
        return;
      }

      const saveBtn = document.getElementById('addSaveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saqlanmoqda...';

      const { error } = await supabaseClient.from('drivers').insert({
        name, plate, route, phone, telegram,
        status: 'offline',
        hours: 'Belgilanmagan',
        payment: 'toʻlangan',
        login: slugifyLogin(name),
        pass: 'drv' + Math.floor(1000 + Math.random() * 9000)
      });

      if (error){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Saqlash';
        alert('Qoʻshishda xatolik: ' + error.message);
        return;
      }

      closeModal();
      await refreshDriversViewInPlace();
    });
  }

  function openAddDriverModal(){
    renderAddDriverForm();
    openModal();
  }

  function setDashView(key){
    const v = views[key];
    navItems.forEach(n => n.classList.toggle('active', n.dataset.view === key));

    if (v.stats){
      dashContent.innerHTML = `
        <h1 class="dash-heading">${v.heading}</h1>
        <p class="dash-subheading">${v.sub}</p>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Roʻyxatdagi yoʻlovchilar</div>
            <div class="stat-value">6,200</div>
            <div class="stat-note">Mudin qishlogʻi aholisi</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Faol haydovchilar</div>
            <div class="stat-value">${driversData.length}</div>
            <div class="stat-note">${driversData.length ? 'Roʻyxatga olingan haydovchilar' : 'Hozircha hech kim qoʻshilmagan'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Bugungi qatnovlar</div>
            <div class="stat-value">—</div>
            <div class="stat-note pending">Ulanish kutilmoqda</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Kunlik tushum</div>
            <div class="stat-value">—</div>
            <div class="stat-note pending">Ulanish kutilmoqda</div>
          </div>
        </div>`;
    } else if (v.drivers){
      dashContent.innerHTML = `
        <h1 class="dash-heading">${v.heading}</h1>
        <p class="dash-subheading">${v.sub}</p>
        ${renderDriversView()}`;

      document.getElementById('addDriverBtn').addEventListener('click', openAddDriverModal);
      document.querySelectorAll('.driver-row').forEach(row => {
        row.addEventListener('click', () => openDriverModal(Number(row.dataset.idx)));
      });
    } else {
      dashContent.innerHTML = `
        <h1 class="dash-heading">${v.heading}</h1>
        <p class="dash-subheading">${v.sub}</p>
        <div class="empty-panel">
          <strong>Bu boʻlim hali tayyor emas</strong>
          Tez orada shu yerda ishlaydi.
        </div>`;
    }
  }

  navItems.forEach(item => {
    item.addEventListener('click', async () => {
      if (item.dataset.view === 'haydovchilar'){
        dashContent.innerHTML = '<p class="dash-subheading">Yuklanmoqda...</p>';
        await loadDriversFromServer();
      }
      setDashView(item.dataset.view);
      drawerRoot.classList.remove('drawer-open');
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    drawerRoot.classList.remove('drawer-open');
    loginInput.value = '';
    passInput.value = '';
    options.forEach(o => { o.classList.remove('active'); o.closest('.stop').classList.remove('is-active'); });
    continueBtn.classList.remove('shown');
    hint.classList.remove('shown');
    selectedRole = null;
    showScreen('screen-auth');
  });
</script>
</body>
</html>
